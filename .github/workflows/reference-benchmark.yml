name: reference-benchmark

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "PouchDB test seed"
        required: true
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  benchmark:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      POUCHDB_COMMIT: 27de91f1105a8074ddd06f5a23156dd99c4eb016
      BENCHMARK_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed || format('pr-{0}', github.event.pull_request.head.sha) }}
      RUNNER_LABEL: ubuntu-24.04
    steps:
      - name: Checkout pouchdb-nextjs-router
        uses: actions/checkout@v4
        with:
          path: pouchdb-nextjs-router
          ref: ${{ env.BENCHMARK_COMMIT_SHA }}

      - name: Checkout the pinned PouchDB test corpus
        uses: actions/checkout@v4
        with:
          repository: apache/pouchdb
          ref: ${{ env.POUCHDB_COMMIT }}
          path: pouchdb

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Expose campaign identity
        run: |
          echo "Commit SHA: $BENCHMARK_COMMIT_SHA"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Runner: ubuntu-24.04"
          echo "Node: $(node --version)"
          echo "PouchDB commit: $POUCHDB_COMMIT"
          echo "SEED: $SEED"

      - name: Install and build the pinned PouchDB checkout
        working-directory: pouchdb
        run: |
          npm ci
          npm run build

      - name: Install and build pouchdb-nextjs-router
        working-directory: pouchdb-nextjs-router
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm ci
          npm run build

      - name: Validate the reference PouchDB suite outside the benchmark
        working-directory: pouchdb-nextjs-router
        env:
          BAIL: 0
          REFERENCE_BENCHMARK: 1
        run: |
          set -o pipefail
          echo "Functional validation SEED: $SEED"
          npm run test 2>&1 | tee ../functional-validation.log

      - name: Run five deterministic alternating A/B pairs
        working-directory: pouchdb-nextjs-router
        env:
          BENCHMARK_RUNS: 5
          FUNCTIONAL_VALIDATION: passed
        run: |
          echo "Benchmark SEED: $SEED"
          npm run benchmark

      - name: Upload raw benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-benchmark-${{ env.BENCHMARK_COMMIT_SHA }}
          path: |
            pouchdb-nextjs-router/benchmark-results/
            functional-validation.log
          if-no-files-found: warn
          retention-days: 30
